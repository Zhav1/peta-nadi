services:
  - type: web
    name: peta-nadi
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: .
    plan: free
    region: singapore
    healthCheckPath: /health
    envVars:
      # Production-required secrets (set in the Render dashboard; repo keeps only
      # `sync: false` placeholders):
      #   SUPABASE_SERVICE_ROLE_KEY : true service_role JWT (NOT the anon key).
      #                               Missing => RLS denies incident/data_sources
      #                               writes; /health/sources flags Supabase Write.
      #   TOMTOM_API_KEY            : traffic enrichment. Missing => TomTom
      #                               reports degraded instead of healthy.
      #   REDIS_URL                 : rediss:// Upstash/Render Redis. Powers
      #                               health hashes, dedup, caches and SSE fan-out.
      #   TWITTER_BEARER_TOKEN      : social OSINT. Missing => explicit
      #                               disabled_no_token, never fabricated posts.
      - key: APP_NAME
        value: "PreHub API"
      - key: ENVIRONMENT
        value: "production"
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: TOMTOM_API_KEY
        sync: false
      - key: DEMO_OFFLINE
        value: "false"
      # Real public sources remain shadow/read-only for operator workflows.
      - key: BMKG_CAP_ENABLED
        value: "true"
      - key: PETABENCANA_NONCOMMERCIAL_ENABLED
        value: "true"
      - key: BNPB_OBSERVED_ENABLED
        value: "true"
      # Phase 162 (M8): production is a THIN web process. Batch ingestion no
      # longer runs in-process; it is driven by the protected external tick
      # POST /internal/tick (cron-job.org, every 5 min, 90s timeout) — see
      # docs/KEEPALIVE_RUNBOOK.md. POLLERS_ENABLED now only gates the continuous
      # consumers (AIS WebSocket, validated-alert fan-out).
      - key: POLLERS_ENABLED
        value: "true"
      - key: INPROCESS_BATCH_POLLERS
        value: "false"
      # Shared secret for X-Internal-Token (dashboard-only; never in the repo).
      - key: INTERNAL_TICK_TOKEN
        sync: false
      # Three scheduled job slots per five-minute tick; 180s work budget stays
      # below the 240s fenced lease and leaves recovery margin before the next tick.
      - key: TICK_MAX_JOBS
        value: "3"
      - key: TICK_BUDGET_SECONDS
        value: "180"
      # Application-side caps only; these are not claimed provider quotas.
      - key: PROVIDER_BUDGET_DAILY_LIMITS
        value: "bmkg=288,bmkg_cap=288,open_meteo=4,firms=8,tomtom=48,petabencana=96,bnpb=24,news=288,pihps=1,social=24"
      - key: PILOT_SHADOW_MODE
        value: "true"
      - key: SHARED_SNAPSHOT_READS_ONLY
        value: "true"
      # Mistral PRIMARY chat provider — secret value dashboard-only (sync:false, no value in yaml)
      - key: MISTRAL_API_KEY
        sync: false
      - key: MISTRAL_MODEL
        value: "deepseek-v4-1-flash-1017"
      # Phase 58 LLM migration: secret values dashboard-only (sync:false, no value in yaml)
      - key: OPENCODE_API_KEY
        sync: false
      - key: OPENCODE_REASONING_MODEL
        value: "mimo-v2.6-pro"
      - key: OPENCODE_REASONING_EFFORT
        value: "low"
      - key: OPENCODE_DRIVER_MODEL
        value: "deepseek-v4.1-flash"
      # GEMINI_API_KEY kept — LTM embeddings stay on Google models/text-embedding-004
      - key: GEMINI_API_KEY
        sync: false
      - key: AISSTREAM_API_KEY
        sync: false
      - key: TWITTER_BEARER_TOKEN
        sync: false
      - key: NASA_FIRMS_MAP_KEY
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_JWT_SECRET
        sync: false
      - key: CORS_ORIGINS
        value: "https://pre-hub.vercel.app,https://peta-nadi.onrender.com,http://localhost:3000"
      - key: APP_URL
        value: "https://peta-nadi.onrender.com"
      - key: PREHUB_DB_PATH
        value: "/app/data/prehub_local.db"
