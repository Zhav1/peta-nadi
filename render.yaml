services:
  - type: web
    name: prehub-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: .
    plan: free
    region: singapore
    envVars:
      - key: APP_NAME
        value: "PreHub API"
      - key: ENVIRONMENT
        value: "production"
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: TOMTOM_API_KEY
        sync: false
      - key: DEMO_OFFLINE
        value: "false"
      # Phase 58 LLM migration: secret values dashboard-only (sync:false, no value in yaml)
      - key: OPENCODE_API_KEY
        sync: false
      - key: OPENCODE_REASONING_MODEL
        value: "mimo-v2.6-pro"
      - key: OPENCODE_DRIVER_MODEL
        value: "deepseek-v4.1-flash"
      # GEMINI_API_KEY kept — LTM embeddings stay on Google models/text-embedding-004
      - key: GEMINI_API_KEY
        sync: false
      # GEMINI_MODEL unused — chat disabled; embeddings use hardcoded models/text-embedding-004
      - key: GEMINI_MODEL
        value: "unused-chat-disabled"
      # NVIDIA NIM fallback keys — secret values dashboard-only (sync:false, no value in yaml)
      - key: NVIDIA_DEEPSEEK_V4_PRO
        sync: false
      - key: NVIDIA_DEEPSEEK_V4_FLASH
        sync: false
      - key: AISSTREAM_API_KEY
        sync: false
      - key: NASA_FIRMS_MAP_KEY
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_JWT_SECRET
        sync: false
      - key: CORS_ORIGINS
        value: "https://peta-nadi.onrender.com"
      - key: APP_URL
        value: "https://peta-nadi.onrender.com"
      - key: PREHUB_DB_PATH
        value: "/app/data/prehub_local.db"
