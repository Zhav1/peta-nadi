services:
  caddy:
    image: caddy:2-alpine
    container_name: prehub-caddy
    ports:
      - "80:80"
      - "443:443"
    environment:
      # Used by Caddyfile: `{$API_DOMAIN}` (automatic TLS for api.<DOMAIN>).
      - API_DOMAIN=${API_DOMAIN:-}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      backend:
        condition: service_healthy
    restart: always

  redis:
    image: redis:7-alpine
    container_name: prehub-redis
    # Production hardening: no host port publish — Redis is only reachable on
    # the compose network (backend connects to prehub-redis:6379). Local dev
    # that needs Redis on the host should add `6379:6379` in
    # docker-compose.override.yml (the dev-only file).
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    restart: always
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

  backend:
    # Production image name is injected by the deploy pipeline (.env on the VPS
    # or shell env: IMAGE=ghcr.io/<owner>/<repo>/backend, IMAGE_TAG=<sha>).
    # Keep both image + build: `docker compose pull` targets GHCR in prod,
    # while local dev (`docker compose up`) still builds when the image is
    # missing. IMAGE_TAG can be moved back to a previous SHA for rollback.
    image: ${IMAGE:-prehub-backend}:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: prehub-backend
    ports:
      # Loopback only: Caddy terminates TLS and is the single public entry
      # point. Publishing 0.0.0.0:8000 would expose the API unencrypted and
      # bypass the reverse proxy.
      - "127.0.0.1:8000:8000"
    volumes:
      - prehub_data:/app/data
    # Keep ONE worker. In production (INPROCESS_BATCH_POLLERS=false) the batch
    # pollers are driven by the scheduler sidecar, but the lifespan still starts
    # the AIS WebSocket and the validated-alert fan-out consumer per process —
    # the fan-out is NOT gated on POLLERS_ENABLED — so --workers >1 duplicates
    # both. In dev (override file) the full in-process poller set also runs.
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 1
    env_file:
      - .env
    environment:
      - PYTHONUNBUFFERED=1
      - PORT=8000
      - REDIS_URL=redis://prehub-redis:6379
      - REDIS_PASSWORD=
      # Dispatcher writes (fleet/travels/approvals/outcomes) must persist on the
      # VPS operational deployment. render.yaml/koyeb.yaml keep shadow=true for
      # the research pilot; compose is the live pilot deployment.
      - PILOT_SHADOW_MODE=false
      - PREHUB_DB_PATH=/app/data/prehub_local.db
    depends_on:
      redis:
        condition: service_healthy
    restart: always
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  scheduler:
    # Thin-web sidecar (Phase 162): POSTs /internal/tick every 300 s so batch
    # ingestion never competes with boot on the single uvicorn worker.
    # - 202/200 → accepted, sleep 300 s (curl --max-time 90 bounded).
    # - transient failure (backend restarting, network hiccup) → exponential
    #   backoff 15s..180s instead of a crash loop.
    # - 404 → INTERNAL_TICK_TOKEN is not set in the backend env; run to a
    #   halt so the misconfiguration is loud in `docker compose logs scheduler`.
    image: curlimages/curl:latest
    container_name: prehub-scheduler
    environment:
      # Compose interpolates this from the VPS .env; the escaping `$$` defers
      # the token read to the container shell so it never ends up in command.
      - INTERNAL_TICK_TOKEN=${INTERNAL_TICK_TOKEN:-}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -u
        fail_count=0
        while true; do
          code=$$(curl -s -o /dev/null -w '%{http_code}' --max-time 90 \
            -X POST http://backend:8000/internal/tick \
            -H "X-Internal-Token: $${INTERNAL_TICK_TOKEN}" || echo curl_error)
          echo "[scheduler] $$(date -u '+%Y-%m-%dT%H:%M:%SZ') POST /internal/tick -> $${code}"
          if [ "$$code" = "202" ] || [ "$$code" = "200" ]; then
            fail_count=0
            sleep 300
          elif [ "$$code" = "404" ]; then
            echo "[scheduler] FATAL: backend returned 404 — INTERNAL_TICK_TOKEN not set; stopping."
            exit 1
          else
            # Transport error (backend still starting / restarting) or an unexpected
            # status: back off instead of crash-looping, then try again.
            fail_count=$$((fail_count + 1))
            if [ "$$fail_count" -gt 12 ]; then sleep 180; else sleep $$((fail_count * 15)); fi
          fi
        done
    depends_on:
      backend:
        condition: service_healthy
    restart: always

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: prehub-frontend
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOSTNAME=0.0.0.0
      - NEXT_PUBLIC_API_URL=http://localhost:8000
      - NEXT_PUBLIC_WS_URL=ws://localhost:8000
    depends_on:
      backend:
        condition: service_healthy
    restart: always
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  prehub_data:
    name: prehub_data
  redis_data:
    name: prehub_redis_data
  caddy_data:
    name: prehub_caddy_data
  caddy_config:
    name: prehub_caddy_config
